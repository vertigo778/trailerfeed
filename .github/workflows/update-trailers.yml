name: Update trailers

on:
  schedule:
    - cron: "17 9 * * *" # daily at 09:17 UTC
  workflow_dispatch: # lets you run it by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: update-trailers
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch new popular trailers
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }} # optional, for movie summaries
          # Optional tuning via Settings > Secrets and variables > Actions > Variables (see README)
          SEARCH_WINDOW_DAYS: ${{ vars.SEARCH_WINDOW_DAYS }}
          KEEP_DAYS: ${{ vars.KEEP_DAYS }}
          MIN_VIEWS: ${{ vars.MIN_VIEWS }}
          MAX_ITEMS: ${{ vars.MAX_ITEMS }}
          REGION_CODE: ${{ vars.REGION_CODE }}
          QUERIES: ${{ vars.QUERIES }}
          ENGLISH_ONLY: ${{ vars.ENGLISH_ONLY }}
          CHANNELS: ${{ vars.CHANNELS }}
          SAME_TRAILER_DAYS: ${{ vars.SAME_TRAILER_DAYS }}
          TV_CHANNELS: ${{ vars.TV_CHANNELS }}
          TV_QUERIES: ${{ vars.TV_QUERIES }}
          TV_MIN_VIEWS: ${{ vars.TV_MIN_VIEWS }}
          GAMES_CHANNELS: ${{ vars.GAMES_CHANNELS }}
          GAMES_QUERIES: ${{ vars.GAMES_QUERIES }}
          GAMES_MIN_VIEWS: ${{ vars.GAMES_MIN_VIEWS }}
        run: node scripts/fetch-trailers.mjs

      - name: Build movie pages and sitemap
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: node scripts/build-pages.mjs

      - name: Commit data if it changed
        run: |
          git add -A data movies tv games sitemap.xml robots.txt
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update trailers $(date -u +%Y-%m-%d)"
          git push
